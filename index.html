<style>
:root{
  --bg:#FBF4F6; --surface:#FFFFFF; --ink:#2B1A33; --muted:#76657F; --line:#EBDCE3;
  --accent:#C9185A; --accent-ink:#FFFFFF;
  --stage:#FFE7DC; --floor:#F0B7A3; --fig:#2B1A33; --fig-far:#B58AA0;
  --overlay:rgba(43,26,51,.45);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A1120; --surface:#271A2F; --ink:#F7EBF1; --muted:#BAA5C3; --line:#3B2B46;
    --accent:#FF6A9A; --accent-ink:#2A0C19;
    --stage:#3A2433; --floor:#6A4558; --fig:#FBEFF4; --fig-far:#A98799;
    --overlay:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#1A1120; --surface:#271A2F; --ink:#F7EBF1; --muted:#BAA5C3; --line:#3B2B46;
  --accent:#FF6A9A; --accent-ink:#2A0C19;
  --stage:#3A2433; --floor:#6A4558; --fig:#FBEFF4; --fig-far:#A98799;
  --overlay:rgba(0,0,0,.6);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
ul{margin:0;padding:0;list-style:none}
#app{max-width:560px;margin:0 auto;padding:20px 16px 150px}
.tab{display:none}
.tab.on{display:block}
.head-title{font-size:32px;line-height:1.05;font-weight:800;letter-spacing:-.02em}
.head-sub{color:var(--muted);margin-top:6px;max-width:36ch}
.sec-title{font-size:20px;font-weight:700;margin:28px 0 12px;letter-spacing:-.01em}

.figbox{background:var(--stage);border-radius:16px;aspect-ratio:240/150;overflow:hidden;width:100%}
.figbox.sm{border-radius:10px}
.fig{width:100%;height:100%;display:block}
.floor{stroke:var(--floor);stroke-width:3;stroke-linecap:round}
.dev{stroke:var(--accent);stroke-width:7;stroke-linecap:round;opacity:.55}
.limb{stroke:var(--fig);stroke-width:7;stroke-linecap:round;fill:none}
.limb.far{stroke:var(--fig-far)}
.head{fill:var(--accent)}
.wt{fill:var(--surface);stroke:var(--accent);stroke-width:3.5}
.cuff{fill:none;stroke:var(--accent);stroke-width:4}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;font-weight:700;border:2px solid var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{min-height:40px;padding:0 16px;font-size:15px}
.btn.big{min-height:60px;font-size:18px}
.btn.block{width:100%}
.btn svg{width:20px;height:20px}

.today{border-radius:24px;padding:18px;margin-top:22px;border:2px solid var(--dc,var(--ink));background:color-mix(in srgb,var(--dc,var(--accent)) 12%,var(--surface))}
.today .lab{font-weight:700;color:var(--dc,var(--accent))}
.today h2{font-size:26px;font-weight:800;line-height:1.1;margin-top:2px;letter-spacing:-.01em}
.today .meta{color:var(--muted);margin:6px 0 14px}
.today .acts{display:flex;gap:8px;flex-wrap:wrap}
.today .btn.primary{background:var(--dc,var(--accent));border-color:var(--dc,var(--accent));color:#fff}

.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.fact b{display:block;font-size:20px;font-weight:800}
.fact span{color:var(--muted);font-size:14px}

.week{display:flex;justify-content:space-between;margin-top:14px;gap:6px}
.dayl{flex:1;text-align:center;font-size:13px;color:var(--muted)}
.dot{width:100%;max-width:38px;aspect-ratio:1;margin:0 auto 6px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.dot.done{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dot.now{border-color:var(--ink)}

<script>
(function(){
"use strict";

/* ---------- Ícones ---------- */
var IC = {
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  minus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14"/></svg>',
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
  pause:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>',
  prev:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 6h2v12H7zM19 6v12L10 12z"/></svg>',
  next:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M15 6h2v12h-2zM5 6l9 6-9 6z"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  sound:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg>',
  mute:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>'
};

/* ---------- Esqueleto e poses ---------- */
var KEYS=['head','neck','hip','e1','h1','e2','h2','k1','f1','k2','f2'];
var S={head:[120,26],neck:[120,40],hip:[120,78],e1:[120,58],h1:[120,76],k1:[120,104],f1:[120,130]};
function P(o){
  var p=Object.assign({},S,o);
  if(!o.e2)p.e2=[p.e1[0]+5,p.e1[1]];
  if(!o.h2)p.h2=[p.h1[0]+5,p.h1[1]];
  if(!o.k2)p.k2=[p.k1[0]+5,p.k1[1]];
  if(!o.f2)p.f2=[p.f1[0]+5,p.f1[1]];
  return p;
}
var FL={k1:[116,104],f1:[116,130],k2:[124,104],f2:[124,130]};
function PF(o){return P(Object.assign({},FL,o));}

var G_PER='Pernas e glúteos',G_ABD='Abdômen',G_BRA='Braços e ombros',G_COS='Peito e costas',G_COR='Corpo todo',G_CAR='Cardio e aquecimento',G_ALO='Alongamento e mobilidade';
var EX=[],BY={};
function E(id,nome,grupo,ms,dica,a,b,x){
  var o={id:id,nome:nome,grupo:grupo,ms:ms,dica:dica,a:a,b:b};
  if(x)Object.assign(o,x);
  EX.push(o);BY[id]=o;
}
function CL(id,nome,like,x){
  var o=Object.assign({},BY[like],{id:id,nome:nome});
  if(x)Object.assign(o,x);
  EX.push(o);BY[id]=o;
}

/* Pernas e glúteos */
E('agach','Agachamento',G_PER,2200,'Pés na largura dos ombros. Leve o quadril para trás, desça até as coxas ficarem paralelas ao chão e suba empurrando o chão com os calcanhares.',
  P({e1:[134,48],h1:[152,48]}),
  P({head:[114,50],neck:[110,62],hip:[98,98],e1:[126,62],h1:[146,60],k1:[122,102],f1:[112,130]}));
E('agach_pausa','Agachamento com pausa',G_PER,3200,'Agache normalmente e segure 2 segundos embaixo antes de subir. Mantenha o peso nos calcanhares.',
  P({e1:[134,48],h1:[152,48]}),
  P({head:[114,50],neck:[110,62],hip:[98,98],e1:[126,62],h1:[146,60],k1:[122,102],f1:[112,130]}),{hold:.3});
E('agach_peso','Agachamento com peso',G_PER,2400,'Segure o peso junto ao peito. Desça levando o quadril para trás, com o tronco reto e os joelhos alinhados, e suba empurrando o chão.',
  P({e1:[124,58],h1:[130,48]}),
  P({head:[114,50],neck:[110,62],hip:[98,98],e1:[118,76],h1:[124,66],k1:[122,102],f1:[112,130]}),{w:1});
E('sumo','Agachamento sumô',G_PER,2400,'Pés bem afastados e pontas para fora. Desça mantendo o tronco reto e os joelhos na direção dos pés.',
  PF({e1:[112,58],h1:[118,70],e2:[128,58],h2:[122,70],k1:[106,104],f1:[96,130],k2:[134,104],f2:[144,130]}),
  PF({head:[120,48],neck:[120,62],hip:[120,100],e1:[110,78],h1:[118,68],e2:[130,78],h2:[122,68],k1:[94,102],f1:[92,130],k2:[146,102],f2:[148,130]}),{front:true});
E('agach_calc','Agachamento com elevação de calcanhar',G_PER,2600,'Agache e, ao subir, termine na ponta dos pés, contraindo as panturrilhas. Desça os calcanhares com controle.',
  P({head:[114,50],neck:[110,62],hip:[98,98],e1:[126,62],h1:[146,60],k1:[122,102],f1:[112,130]}),

  var segs=defs.map(function(d){var l=mk('line',{'class':d[2]});svg.appendChild(l);return {l:l,a:d[0],b:d[1]};});

function draw(f,e,A,B){

  KEYS.forEach(function(k){
    p[k]=[A[k][0]+(B[k][0]-A[k][0])*e,A[k][1]+(B[k][1]-A[k][1])*e];
  });
  f.segs.forEach(function(s){
    var u=p[s.a],v=p[s.b];
    s.l.setAttribute('x1',u[0].toFixed(1));s.l.setAttribute('y1',u[1].toFixed(1));
    s.l.setAttribute('x2',v[0].toFixed(1));s.l.setAttribute('y2',v[1].toFixed(1));
  });
  f.head.setAttribute('cx',p.head[0].toFixed(1));
  f.head.setAttribute('cy',p.head[1].toFixed(1));
  f.extras.forEach(function(x){
    x.el.setAttribute('cx',p[x.k][0].toFixed(1));
    x.el.setAttribute('cy',p[x.k][1].toFixed(1));

function loop(t){
  for(var i=figs.length-1;i>=0;i--){
    var f=figs[i];
    if(!f.box.isConnected){if(IO)IO.unobserve(f.box);figs.splice(i,1);continue;}
    if(f.box._vis===false)continue;
    if(!f.box.getClientRects().length)continue;
    var h=f.ex.hold||.12,fr=f.ex.fr,x;
    if(fr){
      var n=fr.length,seg=(t%f.ex.ms)/f.ex.ms*n,ix=Math.floor(seg),u=seg-ix;
      x=Math.min(1,Math.max(0,(u-h)/(1-2*h)));

      var tri=ph<.5?ph*2:2-ph*2;
      x=Math.min(1,Math.max(0,(tri-h)/(1-2*h)));

    }
  }
  requestAnimationFrame(loop);
}

/* ---------- Montagem dos passos do treino ---------- */
function buildSteps(blocks,warm){
  var flat=[];
  blocks.forEach(function(b){
    if(b.tipo==='aquecimento'&&!warm)return;
    var R=b.rodadas||1,r;
    for(r=0;r<R;r++)b.items.forEach(function(it){flat.push({it:it,b:b,r:r,R:R});});
  });
  var steps=[];
  function subTxt(e,s,n){
    var t=[];
    if(e.R>1)t.push('Rodada '+(e.r+1)+' de '+e.R);
    if(n>1)t.push('Série '+s+' de '+n);
    return t.join(' · ');
  }
  flat.forEach(function(e,i){
    var it=e.it,main=e.b.tipo==='treino',n=it.sets||1,s;
    for(s=1;s<=n;s++){
      var base={id:it.id,bloco:e.b.titulo,titulo:it.titulo||BY[it.id].nome,sub:subTxt(e,s,n),nota:it.nota||''};
      if(it.secs)steps.push(Object.assign({type:'time',dur:it.secs*1000,label:it.label||''},base));
      else steps.push(Object.assign({type:'reps',reps:String(it.reps),dur:0},base));
      var nx=flat[i+1];
      if(s<n){
        steps.push({type:'rest',dur:st.rest*1000,label:'Descanso'});
      }else if(nx){
        if(main&&nx.b===e.b)steps.push({type:'rest',dur:st.rest*1000,label:'Descanso'});
        else if(nx.b!==e.b)steps.push({type:'rest',dur:10000,label:'Prepare-se'});
      }
    }
  });
  if(!steps.length)return steps;
  steps.unshift({type:'rest',dur:5000,label:'Prepare-se'});
  var k,j;
  for(k=0;k<steps.length;k++){
    if(steps[k].type==='rest'){
      j=k+1;
      while(j<steps.length&&steps[j].type==='rest')j++;
      var nxt=steps[j];
      if(nxt){steps[k].id=nxt.id;steps[k].bloco=nxt.bloco;steps[k].nextTitle=nxt.titulo;steps[k].nextSub=nxt.sub;}
    }else{
      j=k+1;
      while(j<steps.length&&(steps[j].type==='rest'||steps[j].titulo===steps[k].titulo))j++;
      steps[k].after=steps[j]?steps[j].titulo:'';
    }
  }
  return steps;
}
function estSec(steps){
  var t=0;
  steps.forEach(function(s){
    if(s.type==='reps'){var n=parseInt(s.reps,10)||10;t+=Math.max(25,n*3);}
    else t+=s.dur/1000;
  });
  return t;
}
function estMin(blocks,warm){return Math.max(1,Math.round(estSec(buildSteps(blocks,warm))/60));}

  var out=[];

  return out;

function itemTxt(it,round){

function beep(freq,dur){

  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')actx.resume();
    var o=actx.createOscillator(),g=actx.createGain();

    o.start();o.stop(actx.currentTime+dur);
  }catch(e){}
}

function updateTime(){
  if(!pl||pl.finished)return;
  var s=pl.steps[pl.k];
  if(s.type==='reps')return;
  var t=document.getElementById('p-time'),r=document.getElementById('p-ring');
  if(!t||!r)return;
  t.textContent=Math.max(0,Math.ceil(pl.left/1000));
  var frac=Math.max(0,Math.min(1,pl.left/s.dur));
  r.setAttribute('stroke-dashoffset',(CIRC*(1-frac)).toFixed(2));
}
function tick(){
  if(!pl||pl.finished)return;
  var now=performance.now();
  var s=pl.steps[pl.k];
  if(s.type==='reps'){pl.last=now;return;}
  if(!pl.paused)pl.left-=now-pl.last;
  pl.last=now;
  var sec=Math.ceil(pl.left/1000);
  if(sec!==pl.sec){pl.sec=sec;if(sec>0&&sec<=3&&!pl.paused)beep(700,.08);}
  if(pl.left<=0){goStep(pl.k+1);return;}
  updateTime();
}
function goStep(k){
  if(k<0)k=0;
  if(k>=pl.steps.length){finishWorkout();return;}
  pl.k=k;
  var s=pl.steps[k];
  pl.left=s.dur;pl.last=performance.now();pl.sec=-1;pl.paused=false;
  beep(s.type==='rest'?520:900,.2);
  renderPlayer();
}
function finishWorkout(){
  pl.finished=true;
  var key=dkey(new Date());
  st.hist[key]=(st.hist[key]||0)+1;
  save();
  beep(660,.15);setTimeout(function(){beep(880,.25);},180);
  renderPlayer();
}

var MEDS=[['cintura','Cintura'],['abdomen','Abdômen'],['quadril','Quadril'],['braco','Braço'],['coxa','Coxa']];
var WD=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
var pendDel=null,editId=null;
function num(v){if(v===null||v===undefined)return null;var s=String(v).trim().replace(',','.');if(!s)return null;var n=parseFloat(s);return isNaN(n)?null:n;}
function fmt(n,d){return n.toFixed(d===undefined?1:d).replace('.',',');}
function sgn(n,d){return (n>0?'+':(n<0?'−':''))+fmt(Math.abs(n),d);}
function fdate(k){var p=k.split('-');return p[2]+'/'+p[1]+'/'+p[0];}

function sortedEntries(){return st.prog.entries.slice().sort(function(a,b){return a.date<b.date?-1:(a.date>b.date?1:a.id-b.id);});}
function bmiCat(b){
  if(b<18.5)return 'Abaixo do peso';
  if(b<25)return 'Peso adequado';
  if(b<30)return 'Sobrepeso';
  if(b<35)return 'Obesidade grau I';

function nextApp(dia){
  var d=new Date(),diff=(+dia-d.getDay()+7)%7;
  if(diff===0)return 'hoje';

  return WD[d.getDay()]+', '+String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');
}
function chartSVG(pts){
  var W=320,H=150,l=40,r=14,t=14,b=24,i;
  var vals=pts.map(function(p){return p.v;});
  var minV=Math.min.apply(null,vals),maxV=Math.max.apply(null,vals);
  if(maxV-minV<2){var m=(maxV+minV)/2;minV=m-1;maxV=m+1;}else{minV-=.5;maxV+=.5;}
  var t0=pts[0].t,t1=pts[pts.length-1].t,span=(t1-t0)||1;
  function X(tt){return pts.length===1?(l+(W-l-r)/2):l+(tt-t0)/span*(W-l-r);}
  function Y(v){return t+(maxV-v)/(maxV-minV)*(H-t-b);}
  var g='',path='',dots='';
  for(i=0;i<3;i++){var yy=t+i*(H-t-b)/2;g+='<line class="ch-g" x1="'+l+'" y1="'+yy.toFixed(1)+'" x2="'+(W-r)+'" y2="'+yy.toFixed(1)+'"/>';}
  pts.forEach(function(p,idx){
    path+=(idx?'L':'M')+X(p.t).toFixed(1)+' '+Y(p.v).toFixed(1)+' ';
    dots+='<circle class="ch-d" cx="'+X(p.t).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="'+(idx===pts.length-1?5:3.5)+'"/>';
  });
  function sd(k){var q=k.split('-');return q[2]+'/'+q[1];}
  var lab='<text class="ch-t" x="'+(l-6)+'" y="'+(t+4)+'" text-anchor="end">'+fmt(maxV)+'</text><text class="ch-t" x="'+(l-6)+'" y="'+(H-b+4)+'" text-anchor="end">'+fmt(minV)+'</text>'+
    '<text class="ch-t" x="'+l+'" y="'+(H-6)+'">'+sd(pts[0].d)+'</text>'+(pts.length>1?'<text class="ch-t" x="'+(W-r)+'" y="'+(H-6)+'" text-anchor="end">'+sd(pts[pts.length-1].d)+'</text>':'');
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Gráfico de peso ao longo do tempo">'+g+'<path class="ch-l" d="'+path+'"/>'+dots+lab+'</svg>';
}
function renderProg(){
  var el=document.getElementById('tab-prog');
  var pr=st.prog,es=sortedEntries(),i;
  var wl=es.filter(function(e){return e.peso;});
  var first=wl[0],last=wl[wl.length-1];
  var h=pr.altura;
  var imcHTML;
  if(h&&last){
    var m=h/100,b=last.peso/(m*m);
    var pos=(Math.max(15,Math.min(40,b))-15)/25*100;
    imcHTML='<div class="bmi-row"><div class="bmi-n">'+fmt(b)+'</div><div class="bmi-c">'+bmiCat(b)+'</div></div>'+
      '<div class="gauge" aria-hidden="true"><i style="flex:14"></i><i class="ok" style="flex:26"></i><i style="flex:20"></i><i style="flex:40"></i></div><div class="gmark" aria-hidden="true"><b style="left:'+pos.toFixed(1)+'%"></b></div>'+
      '<div class="gticks"><span>15</span><span>18,5</span><span>25</span><span>30</span><span>40</span></div>'+
      '<p class="note">Calculado com '+fmt(last.peso)+' kg ('+fdate(last.date)+') e '+h+' cm.</p>';
  }else{
    imcHTML='<p class="note">Informe sua altura e registre seu peso para calcular o IMC.</p>';
  }
  imcHTML+='<div class="inline"><div class="fld"><label for="in-altura">Altura (cm)</label><input class="in" id="in-altura" inputmode="decimal" autocomplete="off" value="'+(h?h:'')+'" placeholder="Ex.: 165"></div><button class="btn small" data-act="save-altura">Salvar</button></div><div class="err" id="alt-err" role="alert"></div>'+
    '<p class="note">O IMC é só uma referência geral. Ele não considera massa muscular nem onde a gordura está distribuída.</p>';

  var wd=es.filter(function(e){return e.dose;});
  var dose;
  if(wd.length){
    var cur=wd[wd.length-1],since=cur.date;
    for(i=wd.length-2;i>=0&&wd[i].dose===cur.dose;i--)since=wd[i].date;
    var chg=[],prev=null;
    wd.forEach(function(e){if(e.dose!==prev){chg.push(e);prev=e.dose;}});
    dose='<div class="dose-big">'+fdoseTxt(cur.dose)+'</div><div class="dose-sub">dose atual, desde '+fdate(since)+'</div>';
    if(chg.length>1){
      dose+='<div class="chg">'+chg.slice().reverse().map(function(e){return '<div><b>'+fdoseTxt(e.dose)+'</b> <span>a partir de '+fdate(e.date)+'</span></div>';}).join('')+'</div>';
    }
  }else{
    dose='<p class="note">Nenhuma dose registrada ainda. Informe a dose ao criar um registro.</p>';
  }
  var dias='<option value="">Não definido</option>'+WD.map(function(n,idx){return '<option value="'+idx+'"'+(String(pr.dia)===String(idx)?' selected':'')+'>'+n.charAt(0).toUpperCase()+n.slice(1)+'</option>';}).join('');
  var nxt=(pr.dia!==''&&pr.dia!==null&&pr.dia!==undefined)?'<p class="note">Próxima aplicação: <b>'+nextApp(pr.dia)+'</b></p>':'';
  dose+='<div class="fld"><label for="in-dia">Dia da aplicação</label><select class="in" id="in-dia" data-chg="dia">'+dias+'</select></div>'+nxt+
    '<p class="note">Mudanças de dose são decisão do seu médico. Aqui você só registra o que foi prescrito.</p>';

  var chart,sum='';
  if(wl.length){
    chart=chartSVG(wl.map(function(e){return {t:Date.parse(e.date+'T00:00:00'),v:e.peso,d:e.date};}));
    var df=last.peso-first.peso,pc=df/first.peso*100;
    sum='<div class="sum"><div><b>'+fmt(first.peso)+'</b><span>kg no início</span></div><div><b>'+fmt(last.peso)+'</b><span>kg agora</span></div><div><b>'+sgn(df)+'</b><span>kg ('+sgn(pc)+'%)</span></div></div>';
  }else{
    chart='<p class="note">Registre seu peso para ver o gráfico.</p>';
  }

  var meds='';
  MEDS.forEach(function(mm){
    var arr=es.filter(function(e){return e[mm[0]];});
    if(!arr.length)return;
    var f=arr[0],l=arr[arr.length-1];
    var d=l[mm[0]]-f[mm[0]];
    meds+='<div class="mrow"><b>'+mm[1]+'</b><span>'+fmt(l[mm[0]])+' cm'+(arr.length>1?' · '+sgn(d)+' cm desde '+fdate(f.date):'')+'</span></div>';
  });
  if(!meds)meds='<p class="note">Registre cintura, quadril e outras medidas para acompanhar.</p>';

  var hist='';
  es.slice().reverse().forEach(function(e){
    var parts=[];
    MEDS.forEach(function(mm){if(e[mm[0]])parts.push(mm[1]+' '+fmt(e[mm[0]])+' cm');});
    hist+='<div class="hist"><div><b>'+(e.peso?fmt(e.peso)+' kg':'Medidas')+'</b><div class="d">'+fdate(e.date)+'</div>'+(e.dose?'<span class="eq">'+fdoseTxt(e.dose)+'</span>':'')+(parts.length?'<div class="nt">'+parts.join(' · ')+'</div>':'')+(e.nota?'<div class="nt">'+esc(e.nota)+'</div>':'')+'</div><div class="hbtn"><button class="mini" data-act="edit-entry" data-id="'+e.id+'" aria-label="Editar registro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg></button>'+
      (pendDel===e.id?'<button class="mini del" data-act="del-entry" data-id="'+e.id+'">Excluir?</button>':'<button class="mini" data-act="del-entry" data-id="'+e.id+'" aria-label="Excluir registro">'+IC.trash+'</button>')+'</div></div>';
  });
  if(!hist)hist='<p class="note">Nenhum registro ainda.</p>';

  el.innerHTML='<h1 class="head-title">Progresso</h1><p class="head-sub">Registre peso, medidas e a dose da tirzepatida para ver sua evolução.</p>'+
    '<div style="margin-top:18px"><button class="btn primary block" data-act="new-entry">'+IC.plus+'Novo registro</button></div>'+
    '<div class="pcard"><h3>IMC</h3>'+imcHTML+'</div>'+
    '<div class="pcard"><h3>Tirzepatida</h3>'+dose+'</div>'+
    '<div class="pcard"><h3>Peso</h3>'+chart+sum+'</div>'+
    '<div class="pcard"><h3>Medidas</h3>'+meds+'</div>'+
    '<div class="pcard"><h3>Histórico</h3>'+hist+'</div>';
}
function openEntry(id){
  editId=id||null;
  var e=null,es=sortedEntries();
  if(id)es.forEach(function(x){if(x.id===id)e=x;});
  var lastDose='';
  es.forEach(function(x){if(x.dose)lastDose=x.dose;});
  var v=function(k){return e&&e[k]?String(e[k]).replace('.',','):'';};
  var dsel=e?(e.dose||''):lastDose;
  var dopts='<option value="">Não informar</option>'+DOSES.map(function(d){return '<option value="'+d+'"'+(dsel===d?' selected':'')+'>'+fdoseTxt(d)+'</option>';}).join('');
  var mf=MEDS.map(function(mm){return '<div class="fld"><label for="en-'+mm[0]+'">'+mm[1]+' (cm)</label><input class="in" id="en-'+mm[0]+'" inputmode="decimal" autocomplete="off" value="'+v(mm[0])+'"></div>';}).join('');
  var sh=document.getElementById('sheet');
  sh.innerHTML='<div class="sheet-in"><h2 style="margin-top:0">'+(e?'Editar registro':'Novo registro')+'</h2>'+
    '<div class="fgrid"><div class="fld"><label for="en-date">Data</label><input class="in" type="date" id="en-date" value="'+(e?e.date:dkey(new Date()))+'"></div>'+
    '<div class="fld"><label for="en-peso">Peso (kg)</label><input class="in" id="en-peso" inputmode="decimal" autocomplete="off" value="'+v('peso')+'" placeholder="Ex.: 78,4"></div></div>'+
    '<div class="fgrid">'+mf+'</div>'+
    '<div class="fld"><label for="en-dose">Dose de tirzepatida</label><select class="in" id="en-dose">'+dopts+'</select></div>'+
    '<div class="fld"><label for="en-nota">Observações (opcional)</label><textarea class="in" id="en-nota" maxlength="200">'+(e&&e.nota?esc(e.nota):'')+'</textarea></div>'+
    '<div class="err" id="en-err" role="alert"></div>'+
    '<div class="sheet-row" style="margin-top:12px"><button class="btn" data-act="close-sheet">Cancelar</button><button class="btn primary" data-act="save-entry">Salvar</button></div></div>';
  sh.classList.add('show');
}
function saveEntry(){
  var err=document.getElementById('en-err');
  var date=document.getElementById('en-date').value;
  if(!date){err.textContent='Escolha a data.';return;}
  var o={id:editId||Date.now(),date:date};
  var raw=document.getElementById('en-peso').value;
  var peso=num(raw);
  if(raw.trim()&&(peso===null||peso<20||peso>400)){err.textContent='Confira o peso (entre 20 e 400 kg).';return;}
  if(peso!==null)o.peso=Math.round(peso*10)/10;
  var any=peso!==null,k;
  for(k=0;k<MEDS.length;k++){
    var r=document.getElementById('en-'+MEDS[k][0]).value;
    var n=num(r);
    if(r.trim()&&(n===null||n<10||n>250)){err.textContent='Confira a medida de '+MEDS[k][1].toLowerCase()+' (entre 10 e 250 cm).';return;}
    if(n!==null){o[MEDS[k][0]]=Math.round(n*10)/10;any=true;}
  }
  var dose=document.getElementById('en-dose').value;
  if(dose){o.dose=dose;any=true;}
  if(!any){err.textContent='Preencha pelo menos peso, uma medida ou a dose.';return;}
  var nota=document.getElementById('en-nota').value.trim();
  if(nota)o.nota=nota;
  if(editId){st.prog.entries=st.prog.entries.map(function(x){return x.id===editId?o:x;});}
  else st.prog.entries.push(o);
  save();closeSheet();renderProg();
}

/* ---------- Ações ---------- */
function toggleEx(id){
  var idx=-1;
  st.custom.forEach(function(c,i){if(idx<0&&c.id===id)idx=i;});
  if(idx>=0)st.custom.splice(idx,1);else st.custom.push(padOf(id));
  save();
  refreshSel();
}
function swap(i,j){var x=st.custom[i];st.custom[i]=st.custom[j];st.custom[j]=x;}
function bump(v,d,min,max,step){
  var n=parseInt(v,10);if(isNaN(n))n=10;
  n+=d*step;
  return Math.max(min,Math.min(max,n));
}
document.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-act]');
  if(!t)return;
  var a=t.dataset.act,i,c;
  switch(a){
    case 'tab':closeSheet();setTab(t.dataset.tab);break;
    case 'filter':filter=t.dataset.g;renderLib();break;
    case 'info':openSheet(t.dataset.id);break;
    case 'close-sheet':closeSheet();break;
    case 'toggle':
      toggleEx(t.dataset.id);
      if(t.dataset.sheet)closeSheet();
      break;
    case 'day-start':startPlan(DAYS[+t.dataset.i].blocks);break;
    case 'day-view':openDay(+t.dataset.i);break;
    case 'day-edit':
      var items=[];
      DAYS[+t.dataset.i].blocks.forEach(function(b){
        if(b.tipo!=='treino')return;
        b.items.forEach(function(it){
          var o={id:it.id,sets:b.rodadas||it.sets||1};
          if(it.secs)o.secs=it.secs;else o.reps=it.reps;
          items.push(o);
        });
      });
      st.custom=items;save();closeSheet();setTab('mine');
      break;
    case 'start-mine':startPlan(customBlocks());break;
    case 'rest':st.rest=+t.dataset.v;save();renderMine();break;
    case 'warm':st.warm=t.dataset.v==='1';save();renderMine();break;
    case 'sets-':case 'sets+':
      c=st.custom[+t.dataset.i];
      c.sets=bump(c.sets,a==='sets+'?1:-1,1,6,1);save();renderMine();break;
    case 'val-':case 'val+':
      c=st.custom[+t.dataset.i];
      if(c.secs)c.secs=bump(c.secs,a==='val+'?1:-1,10,180,5);
      else c.reps=bump(c.reps,a==='val+'?1:-1,1,60,1);
      save();renderMine();break;
    case 'up':i=+t.dataset.i;if(i>0){swap(i,i-1);save();renderMine();}break;
    case 'down':i=+t.dataset.i;if(i<st.custom.length-1){swap(i,i+1);save();renderMine();}break;
    case 'rm':st.custom.splice(+t.dataset.i,1);save();renderMine();refreshSel();break;
    case 'clear':st.custom=[];save();renderMine();refreshSel();break;
    case 'eqf':eqf=t.dataset.e;renderLib();break;
    case 'new-ex':openNewEx();break;
    case 'pick-base':
      newBase=t.dataset.id;
      document.querySelectorAll('.pk').forEach(function(p){p.classList.toggle('sel',p.dataset.id===newBase);});
      break;
    case 'save-ex':saveNewEx();break;
    case 'del-ex':deleteEx(t.dataset.id);break;
    case 'new-entry':openEntry(null);break;
    case 'edit-entry':openEntry(+t.dataset.id);break;
    case 'save-entry':saveEntry();break;
    case 'del-entry':
      if(pendDel===+t.dataset.id){
        st.prog.entries=st.prog.entries.filter(function(x){return x.id!==pendDel;});
        pendDel=null;save();
      }else pendDel=+t.dataset.id;
      renderProg();
      break;
    case 'save-altura':
      var av=num(document.getElementById('in-altura').value),ae=document.getElementById('alt-err');
      if(av!==null&&av>0&&av<3)av=av*100;
      if(av===null||av<100||av>250){ae.textContent='Informe a altura em centímetros (entre 100 e 250).';break;}
      st.prog.altura=Math.round(av);save();renderProg();
      break;
    case 'p-close':closePlayer();break;
    case 'p-sound':
      st.sound=!st.sound;save();
      document.getElementById('p-sound').innerHTML=st.sound?IC.sound:IC.mute;
      break;
    case 'p-pause':
      if(pl){pl.paused=!pl.paused;pl.last=performance.now();document.getElementById('p-pause').innerHTML=pl.paused?IC.play:IC.pause;}
      break;
    case 'p-set':if(pl)goStep(pl.k+1);break;
    case 'p-next':if(pl)goStep(pl.k+1);break;
    case 'p-prev':
      if(pl){
        var j=pl.k-1;
        while(j>0&&pl.steps[j].type==='rest')j--;
        goStep(Math.max(0,j));
      }
      break;
  }
});
document.addEventListener('keydown',function(ev){
  if((ev.key==='Enter'||ev.key===' ')&&ev.target.getAttribute&&ev.target.getAttribute('role')==='button'){
    ev.preventDefault();ev.target.click();
  }
  if(ev.key==='Escape')closeSheet();
});
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t&&t.id==='lib-q'){query=t.value;renderLibList();}
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t&&t.dataset&&t.dataset.chg==='dia'){st.prog.dia=t.value;save();renderProg();}
});
document.getElementById('sheet').addEventListener('click',function(ev){
  if(ev.target.id==='sheet')closeSheet();
});

setTab('home');
})();
</script>
</body>
</html>
